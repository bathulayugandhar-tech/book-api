# Save this file in your repo as: .github/workflows/build-and-deploy-windows.yml
# Also add deploy/deploy.ps1 to your repo.
#
# Job 1 (build):  GitHub server builds the JAR and uploads it (plus deploy.ps1) as an artifact
# Job 2 (deploy): GitHub server downloads them, copies them to the Windows VM over SSH, runs deploy.ps1
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     - public IP / DNS of the Windows VM
#   VM_USER     - Windows user name (e.g. azureuser or Administrator)
#   VM_SSH_KEY  - PRIVATE SSH key; its public key must be authorized on the VM
#   VM_PORT     - optional, defaults to 22

name: Build JAR and Deploy to Windows VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  JAR_NAME: app.jar

jobs:
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'          # match your project
          cache: maven

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      - name: Collect files to deploy
        run: |
          JAR=$(ls target/*.jar | grep -v -e 'original-' -e '-plain' -e 'sources' -e 'javadoc' | head -n 1)
          echo "Using $JAR"
          mkdir -p dist
          cp "$JAR" "dist/${JAR_NAME}"
          cp deploy/deploy.ps1 dist/deploy.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: app-package
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_TARGET: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
      SSH_PORT: ${{ secrets.VM_PORT || 22 }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-package
          path: dist

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files to Windows VM
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "if not exist C:\app mkdir C:\app"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "dist/${JAR_NAME}"  "$SSH_TARGET:C:/app/${JAR_NAME}.new"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "dist/deploy.ps1"   "$SSH_TARGET:C:/app/deploy.ps1"

      - name: Run deploy script on Windows VM
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "powershell -NoProfile -ExecutionPolicy Bypass -File C:\app\deploy.ps1 -AppDir C:\app -JarName ${JAR_NAME}"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
